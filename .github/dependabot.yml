version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "daily"
  groups:
    github-actions:
      patterns:
        - "*"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "03:00"
  open-pull-requests-limit: 10
  versioning-strategy: increase
  ignore:
    # semantic-release's stable commit-analyzer / release-notes-generator still
    # bundle conventional-changelog-writer v8, which cannot render preset v10.
    # Lift once they move to writer v9.
    - dependency-name: "conventional-changelog-conventionalcommits"
      update-types: ["version-update:semver-major"]
  groups:
    production-dependencies:
      dependency-type: "production"
      update-types:
        - "minor"
        - "patch"
    development-dependencies:
      dependency-type: "development"
      update-types:
        - "minor"
        - "patch"
